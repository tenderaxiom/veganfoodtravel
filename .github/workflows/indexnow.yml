name: Notify search engines (IndexNow)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: python build.py
      - name: Wait for Cloudflare Pages to publish
        run: sleep 120
      - name: Submit sitemap URLs to IndexNow
        run: python scripts/indexnow.py
